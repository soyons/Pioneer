# robot_web_console 配置
# 运行模式: production(生产,只监控) / development(开发,管理进程)
mode: production

# Web Console 自身配置
console:
  host: "0.0.0.0"
  port: 3000
  # 前端静态文件目录(相对于 robot_web_console 根目录)
  static_dir: "frontend"

# 后端服务配置
services:
  camera:
    name: "Camera Service"
    api_url: "http://localhost:8082"
    health_endpoint: "/api/health"
    # 开发模式启动配置
    dev:
      enabled: true
      command: ["python3", "-m", "camera_service"]
      cwd: "/workspace/camera_service"
      env:
        PYTHONPATH: "/workspace/camera_service/src"

  teleop:
    name: "Coach"
    api_url: "http://localhost:8080"
    health_endpoint: "/api/health"
    dev:
      enabled: true
      command: ["python3", "-m", "teleop"]
      cwd: "/workspace/teleop"
      env:
        PYTHONPATH: "/workspace/teleop/src"

  robot:
    name: "Robot Controller"
    api_url: "http://localhost:8081"
    health_endpoint: "/api/status"
    dev:
      enabled: true
      command: ["python3", "-m", "robot_controller"]
      cwd: "/workspace/robot_controller"
      env:
        PYTHONPATH: "/workspace/robot_controller/src"

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# 转化后数据集查看根目录(Depot 页面只读浏览)
datasets:
  root: "/workspace/piper_dataset/data"
